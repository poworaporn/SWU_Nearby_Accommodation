<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลองวางน้องหมุดบนแผนที่</title>
  <link rel="stylesheet" href="nong-mood.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f4ea; color: #103a31; font: 16px/1.5 Tahoma, system-ui, sans-serif; }
    header { padding: 15px clamp(14px, 3vw, 32px); background: #103a31; color: #f5e2ad; font-weight: 700; }
    main { padding: clamp(12px, 2.5vw, 28px); }
    h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); }
    main > p { margin: 5px 0 14px; }
    .preview { display: flex; min-width: 0; border: 1px solid #c8d2bc; border-radius: 16px; overflow: hidden; }
    .map {
      position: relative; isolation: isolate; flex: 1; min-width: 0; height: clamp(350px, 65vh, 660px);
      background: #dce8d3;
      overflow: hidden;
    }
    .map-art { position: absolute; inset: 0; width: 100%; height: 100%; }
    .toolbar { position: absolute; z-index: 1; top: 9px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 7px; width: fit-content; max-width: calc(100% - 20px); }
    .toolbar button { background: #134338; color: #fff3d0; border: 1px solid #426a55; border-radius: 20px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }
    .toolbar button[aria-pressed="true"] { background: #f8edca; color: #163d32; }
    .legend { position: absolute; bottom: 8px; left: 10px; margin: 0; padding: 4px 9px; border-radius: 15px; background: #fffaf0; font-size: 12px; }
    .panel { width: clamp(175px, 31%, 360px); padding: 16px; background: #fffcf3; border-left: 1px solid #ded7c3; }
    .panel h2 { margin: 0 0 6px; font-size: 19px; }
    .panel p { margin: 0 0 10px; }
    .rent { font-size: 24px; color: #174f42; font-weight: 700; }
    @media (max-width: 540px) {
      .preview { flex-wrap: wrap; }
      .map { flex-basis: 100%; }
      .panel { width: 100%; border-left: 0; border-top: 1px solid #ded7c3; }
    }
  </style>
  <script src="nong-mood.js" defer></script>
  <script defer src="preview.js"></script>
</head>
<body>
  <header>ผลสำรวจที่พักรอบ มศว ประสานมิตร</header>
  <main>
    <h1>ลองวางน้องหมุดบนแผนที่</h1>
    <p>ลากที่ตัวน้องเพื่อย้ายตำแหน่ง ลองเปิดหรือปิดแถบด้านขวาเพื่อดูว่าพื้นที่เปลี่ยนอย่างไร</p>
    <div class="preview">
      <div class="map" id="map-preview">
        <svg class="map-art" viewBox="0 0 960 530" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <pattern id="blocks" width="76" height="58" patternTransform="rotate(12)" patternUnits="userSpaceOnUse">
              <rect width="76" height="58" fill="#dee8d2"/>
              <path d="M0 0H76M0 0V58M42 0V58" stroke="#fcfbef" stroke-width="5"/>
              <path d="M10 10h24v16H10z M48 11h19v14H48z M10 34h20v16H10z M49 34h20v16H49z" fill="#c8d6bf"/>
            </pattern>
          </defs>
          <rect width="960" height="530" fill="url(#blocks)"/>
          <path d="M-40 110L980 374M173-30L37 565M655-40L511 565" stroke="#fffbeb" stroke-width="13" fill="none"/>
          <path d="M-35 254Q260 236 449 321T1000 443" stroke="#9dced6" stroke-width="13" fill="none"/>
          <circle cx="482" cy="345" r="165" fill="#8fa66d21" stroke="#c6a060" stroke-width="3"/>
          <circle cx="482" cy="345" r="101" fill="#75a87b38" stroke="#38765c" stroke-width="3"/>
          <path d="M482 345L494 293L547 292L574 228" stroke="#91653f" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 8" fill="none"/>
          <g font-family="Tahoma, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">
            <rect x="452" y="333" width="60" height="27" rx="13" fill="#b73a35"/><text x="482" y="352" fill="white">มศว</text>
            <rect x="547" y="207" width="60" height="27" rx="13" fill="#184a3c"/><text x="577" y="226" fill="white">20k</text>
            <rect x="373" y="174" width="63" height="27" rx="13" fill="#184a3c"/><text x="404" y="193" fill="white">8.5k</text>
          </g>
        </svg>
        <div class="toolbar" id="preview-toolbar">
          <button type="button" id="toggle-detail" aria-controls="sample-detail" aria-pressed="true">แถบรายละเอียด</button>
          <button type="button" id="reset-mascot">คืนตำแหน่งน้องหมุด</button>
        </div>
        <p class="legend">วงแผนที่ 3 กม. · 6 กม.</p>
      </div>
      <aside class="panel" id="sample-detail">
        <h2>รายละเอียดที่พัก</h2>
        <p class="rent">20,000 บาท/เดือน</p>
        <p>ตัวอย่างแถบข้อมูลขณะเลือกที่พัก</p>
      </aside>
    </div>
  </main>
</body>
</html>
