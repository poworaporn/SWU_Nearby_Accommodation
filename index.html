<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนที่ที่พักรอบ มศว ประสานมิตร</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#1c1a15; --red:#DA2128; --gray:#636466;
    --paper:#f5f1e8; --panel:#fffdf9; --line:#e4dcc5;
    --emerald:#0f4d3a; --emerald-deep:#0a352a;
    --gold:#b98b3e; --gold-light:#f0dfb0; --muted:#8b8371;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%;
    font-family:"IBM Plex Sans Thai","Noto Sans Thai","IBM Plex Sans",sans-serif;
    background:var(--paper); color:var(--ink); }
  .app{ display:grid; grid-template-columns: 350px 1fr; height:100vh; position:relative; overflow:hidden; }

  .sidebar{ border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; overflow:hidden; }
  .sb-head{ padding:22px 20px 14px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#fffdf9,#f9f4e9); }
  .eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:0 0 6px; }
  .sb-head h1{ font-size:19px; line-height:1.35; margin:0 0 8px; color:var(--emerald-deep); font-weight:700; }
  .sb-head p{ font-size:12.5px; color:var(--muted); margin:0; line-height:1.6; }
  .legend{ display:flex; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
  .legend span{display:flex; align-items:center; gap:6px;}
  .swatch-ring{width:14px; height:14px; border-radius:50%; display:inline-block; border:2px solid;}

  .search-wrap{ position:relative; padding:12px 20px 0; background:#fbf8f1; border-bottom:1px solid var(--line); }
  .search-box{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:12px; }
  .search-box:focus-within{ border-color:var(--gold); }
  .search-box input{ flex:1; border:none; outline:none; font-size:13px; font-family:inherit; background:transparent; color:var(--ink); }
  .search-clear{ cursor:pointer; color:var(--muted); font-size:12px; padding:2px 4px; }
  .search-suggest{ position:absolute; left:20px; right:20px; top:100%; z-index:50; background:var(--panel); border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; box-shadow:0 10px 24px rgba(15,77,58,.15); max-height:260px; overflow-y:auto; display:none; }
  .search-suggest.show{ display:block; }
  .search-suggest .sg-item{ display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--line); }
  .search-suggest .sg-item:last-child{ border-bottom:none; }
  .search-suggest .sg-item:hover{ background:#f2ecd9; }
  .search-suggest .sg-name{ font-size:12.5px; font-weight:600; color:var(--emerald-deep); }
  .search-suggest .sg-name mark{ background:var(--gold-light); color:var(--emerald-deep); border-radius:2px; }
  .search-suggest .sg-meta{ font-size:11px; color:var(--muted); }
  .search-suggest .sg-empty{ padding:14px; text-align:center; font-size:12px; color:var(--muted); }

  .controls{ padding:12px 20px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; background:#fbf8f1; }
  .controls .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .controls select{ flex:1; min-width:0; padding:8px 10px; font-size:12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-family:inherit; cursor:pointer; }
  .controls select:focus{ outline:2px solid var(--gold); }
  .amenity-filters summary{ list-style:none; cursor:pointer; font-size:11.5px; color:var(--emerald-deep); font-weight:700; padding:4px 0; }
  .amenity-filters summary::-webkit-details-marker{ display:none; }
  .amenity-grid{ display:flex; flex-wrap:wrap; gap:6px 10px; padding:6px 2px 2px; }
  .amenity-grid label{ display:flex; align-items:center; gap:5px; font-size:11.5px; cursor:pointer; }
  .amenity-grid input{ accent-color:var(--emerald); cursor:pointer; }

  .list{ flex:1; overflow-y:auto; padding:6px 0; }
  .card{ padding:14px 20px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s; }
  .card:hover, .card.selected{ background:#f2ecd9; }
  .card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .card-top .name{ font-weight:700; font-size:14px; color:var(--emerald-deep);}
  .name-th{ font-size:11px; color:var(--muted); font-weight:500; display:block; }
  .card-top .radius-tag{ font-size:10.5px; padding:2px 8px; border-radius:10px; white-space:nowrap; background:#e4f0e9; color:var(--emerald-deep); font-weight:600; }
  .card-top .radius-tag.far{ background:var(--gold-light); color:#7a5a1e;}
  .card-meta{ font-size:12px; color:var(--muted); margin-top:4px; }
  .card-price{ font-size:13px; margin-top:6px; color:var(--gold); font-weight:700;}
  .sb-foot{ padding:12px 20px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }

  #map{ width:100%; height:100%; background:#eae7dc; }
  .leaflet-popup-content-wrapper{ background:var(--panel); border-radius:12px; box-shadow:0 10px 28px rgba(15,77,58,.22); }
  .leaflet-popup-tip{ background:var(--panel); }
  .leaflet-popup-content{ margin:10px 12px !important; }
  .mini-popup{ font-family:inherit; width:100%; max-width:240px; }
  .mini-popup .sv-wrap{ position:relative; margin-bottom:8px; }
  .mini-popup .sv-thumb{ width:100%; height:100px; border:0; border-radius:8px; display:block; }
  .mini-popup .rating-badge{ position:absolute; top:6px; right:6px; background:rgba(10,53,42,0.88); color:#f0dfb0; font-size:11px; font-weight:800; padding:3px 8px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .mini-popup h3{ margin:0 0 2px; font-size:14.5px; color:var(--emerald-deep); }
  .mini-popup .area{ font-size:11.5px; color:var(--muted); margin-bottom:4px; }
  .mini-popup .rent{ font-size:16px; font-weight:800; color:var(--gold); margin-bottom:6px; }
  .mini-popup .review{ font-size:11px; font-style:italic; background:#fbf8f1; border-left:2.5px solid var(--gold); padding:5px 8px; margin-bottom:9px; line-height:1.5; max-height:80px; overflow-y:auto; }
  .mini-popup button{ width:100%; padding:8px 0; border:none; border-radius:8px; background:var(--emerald); color:#fff; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .mini-popup button:hover{ background:var(--emerald-deep); }

  .center-badge{ width:38px; height:38px; border-radius:50%; background:var(--red); border:3px solid #fff; box-shadow:0 3px 10px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; font-size:19px; }
  .pin-badge{ width:34px; height:34px; border-radius:50% 50% 50% 4px; transform:rotate(-45deg); border:2.5px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .pin-badge .pin-icon{ transform:rotate(45deg); font-size:16px; line-height:1; }
  .pin-near{ background:var(--emerald); }
  .pin-far{ background:var(--gold); }
  .station-dot{ width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid #1f4e9c; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#1f4e9c; box-shadow:0 2px 6px rgba(0,0,0,.3); }

  .drawer-overlay{ position:absolute; inset:0; background:rgba(15,77,58,.28); opacity:0; pointer-events:none; transition:opacity .25s; z-index:1600; }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:absolute; top:0; right:0; height:100%; width:430px; max-width:92vw; background:var(--panel); box-shadow:-12px 0 30px rgba(15,77,58,.25); transform:translateX(100%); transition:transform .3s ease; z-index:1601; display:flex; flex-direction:column; }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:22px 22px 16px; border-bottom:1px solid var(--line); position:relative; background:#fbf8f1; }
  .drawer-close{ position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:16px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .badge-row{ display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .badge{ font-size:10.5px; padding:3px 9px; border-radius:10px; background:#e4f0e9; color:var(--emerald-deep); font-weight:600; }
  .badge.dist{ background:var(--gold-light); color:#7a5a1e; }
  .drawer-head h2{ margin:0 0 4px; font-size:19px; color:var(--emerald-deep); font-weight:700; }
  .drawer-head .area{ font-size:12.5px; color:var(--muted); }
  .drawer-price{ padding:18px 22px; background:linear-gradient(135deg,var(--emerald-deep),var(--emerald)); border-bottom:1px solid var(--line); }
  .drawer-price .amount{ font-size:26px; font-weight:800; color:var(--gold-light); }
  .drawer-price .unit{ font-size:12.5px; color:#d8e6de; margin-left:4px; }
  .drawer-body{ flex:1; overflow-y:auto; padding:10px 0 20px; }

  details.section{ border-bottom:1px solid var(--line); }
  details.section summary{ list-style:none; cursor:pointer; padding:13px 22px; font-size:13px; font-weight:700; color:var(--emerald-deep); display:flex; align-items:center; justify-content:space-between; }
  details.section summary::-webkit-details-marker{ display:none; }
  details.section summary::after{ content:'+'; font-size:16px; color:var(--gold); font-weight:700; }
  details.section[open] summary::after{ content:'–'; }
  details.section[open] summary{ background:#fbf8f1; }
  .section-content{ padding:2px 22px 16px; font-size:12.5px; }
  .kv{ display:flex; padding:5px 0; gap:10px; border-bottom:1px dashed #eee; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ width:120px; flex-shrink:0; color:var(--muted); }
  .kv .v{ font-weight:600; word-break:break-word; }
  .tag-wrap{ display:flex; flex-wrap:wrap; gap:6px; width:100%; margin-top:4px; }
  .tag-wrap span{ font-size:11px; background:#e4f0e9; color:var(--emerald-deep); padding:3px 9px; border-radius:8px; line-height:1.4; }
  .quote-block{ margin:14px 22px 0; font-size:12.5px; font-style:italic; background:#fbf8f1; border-left:3px solid var(--gold); padding:10px 12px; line-height:1.6; }
  .quote-src{ font-size:10.5px; color:var(--muted); text-align:right; margin-top:6px; font-style:normal; }
  .gmaps-link{ display:flex; align-items:center; justify-content:center; gap:7px; margin:16px 22px 4px; padding:11px 0; border-radius:9px; background:var(--emerald); color:#fff; text-decoration:none; font-size:13px; font-weight:600; }
  .gmaps-link:hover{ background:var(--emerald-deep); }

  .route-tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .route-tab{ flex:1; padding:7px 0; text-align:center; font-size:12px; font-weight:700; border-radius:8px; border:1.5px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer; }
  .route-tab.active{ background:var(--emerald); color:#fff; border-color:var(--emerald); }
  .route-flow{ display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .route-chip{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:#fff; padding:4px 9px; border-radius:12px; }
  .route-arrow{ color:var(--muted); font-size:12px; }
  .stars-row{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed #eee; font-size:12px; }
  .stars-row:last-child{ border-bottom:none; }
  .stars-row .stars{ color:var(--gold); font-weight:700; }

  @media (max-width: 820px) {
    html, body{ overflow:hidden !important; height:100% !important; position:fixed !important; width:100% !important; }
    .app{ display:block !important; position:relative !important; height:100dvh !important; width:100vw !important; overflow:hidden !important; }
    #map{ position:absolute !important; top:0; left:0; width:100% !important; height:100% !important; z-index:1; }
    .sidebar{ position:absolute !important; left:0; right:0; bottom:0; z-index:10; height:82dvh !important;
      transform:translateY(calc(100% - 130px)); transition:transform 0.3s cubic-bezier(0.25,1,0.5,1);
      border-radius:20px 20px 0 0 !important; box-shadow:0 -4px 20px rgba(0,0,0,0.2) !important;
      display:flex !important; flex-direction:column !important; overflow:hidden !important; }
    .drag-handle{ width:40px; height:5px; background:#ccc; border-radius:3px; margin:8px auto 4px; flex-shrink:0; cursor:grab; }
    .sidebar.expanded{ transform:translateY(0) !important; }
    .sb-head{ padding:4px 16px 6px !important; }
    .sb-head h1{ font-size:15px !important; margin:0 !important; }
    .sb-head p, .eyebrow{ display:none !important; }
    .legend{ padding:4px 16px !important; font-size:10.5px !important; }
    .controls{ padding:6px 16px !important; }
    .search-wrap{ padding:8px 16px 0 !important; }
    .list{ flex:1 !important; overflow-y:auto !important; -webkit-overflow-scrolling:touch !important; padding:10px 16px 30px !important; }
  }
  @media (min-width: 821px){ .drag-handle{ display:none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="mobileSheet">
    <div class="drag-handle"></div>
    <div class="sb-head">
      <p class="eyebrow">ผลสำรวจและงานวิจัย</p>
      <h1>ที่พักรอบมหาวิทยาลัยศรีนครินทรวิโรฒ ประสานมิตร</h1>
      <p>แสดงพิกัดที่พักในระยะ 3 กม. และ 6 กม. จากสนามกีฬากลาง มศว พร้อมข้อมูลจากผู้พักอาศัยจริง</p>
    </div>
    <div class="legend">
      <span><span class="swatch-ring" style="border-color:var(--gray);background:var(--red)"></span>มศว ประสานมิตร</span>
      <span><span class="swatch-ring" style="border-color:var(--emerald);background:#bfe0cd"></span> 3 กม.</span>
      <span><span class="swatch-ring" style="border-color:var(--gold);background:var(--gold-light)"></span> 6 กม.</span>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อที่พัก" autocomplete="off">
        <span class="search-clear" id="searchClear" style="display:none">✕</span>
      </div>
      <div class="search-suggest" id="searchSuggest"></div>
    </div>
    <div class="controls">
      <div class="row">
        <select id="sortSelect">
          <option value="default">เรียงตาม: ค่าเริ่มต้น</option>
          <option value="price-asc">ราคา: ต่ำ → สูง</option>
          <option value="price-desc">ราคา: สูง → ต่ำ</option>
          <option value="dist-asc">ระยะทาง: ใกล้ → ไกล</option>
          <option value="rating-desc">คะแนนรีวิว: สูง → ต่ำ</option>
        </select>
      </div>
      <div class="row">
        <select id="distFilter">
          <option value="all">ระยะ: ทั้งหมด</option>
          <option value="near">3 กม.</option>
          <option value="far">6 กม.</option>
        </select>
        <select id="typeFilter">
          <option value="all">ประเภท: ทั้งหมด</option>
          <option value="คอนโดมิเนียม">คอนโดมิเนียม</option>
          <option value="อพาร์ตเมนต์">อพาร์ตเมนต์</option>
        </select>
      </div>
      <details class="amenity-filters">
        <summary>+ ตัวกรองเพิ่มเติม (สิ่งอำนวยความสะดวก)</summary>
        <div class="amenity-grid">
          <label><input type="checkbox" data-amenity="แอร์" class="amenityCheck">แอร์</label>
          <label><input type="checkbox" data-amenity="เตา" class="amenityCheck">เตาทำอาหาร</label>
          <label><input type="checkbox" data-amenity="ตู้เย็น" class="amenityCheck">ตู้เย็น</label>
          <label><input type="checkbox" data-amenity="ทีวี" class="amenityCheck">ทีวี</label>
          <label><input type="checkbox" data-amenity="เครื่องซักผ้าในห้อง" class="amenityCheck">เครื่องซักผ้าในห้อง</label>
          <label><input type="checkbox" data-amenity="สระว่ายน้ำ" class="amenityCheck"> สระว่ายน้ำ</label>
          <label><input type="checkbox" data-amenity="ฟิตเนส" class="amenityCheck">ฟิตเนส</label>
          <label><input type="checkbox" data-amenity="ลิฟต์" class="amenityCheck">ลิฟต์</label>
          <label><input type="checkbox" data-amenity="ที่จอดรถ" class="amenityCheck">ที่จอดรถ</label>
        </div>
      </details>
    </div>
    <div class="list" id="list"></div>
    <div class="sb-foot">คลิกหมุดหรือรายการ เพื่อดูรายละเอียดจากแบบสอบถามวิจัย</div>
  </aside>
  <div id="map"></div>
  <div class="drawer-overlay" id="overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <button class="drawer-close" id="drawerClose">✕</button>
      <div class="badge-row" id="dBadges"></div>
      <h2 id="dName"></h2>
      <div class="area" id="dArea"></div>
    </div>
    <div class="drawer-price">
      <span class="amount" id="dRent"></span><span class="unit">บาท / เดือน</span>
    </div>
    <div class="drawer-body" id="dBody"></div>
  </div>
</div>

// สถานีที่ใกล้มหาวิทยาลัยที่สุด (ใช้เป็นค่าเริ่มต้นเมื่อผู้ตอบไม่ได้ระบุว่าลงสถานีไหน)
const DEFAULT_UNI_STATION = "Phetchaburi";

function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
// หาสถานีที่ใกล้จุดที่กำหนดที่สุด ภายในสายที่ระบุ
function nearestStation(lat, lng, lineKey){
  const names = LINES[lineKey] || Object.keys(ST);
  let best = null, bestD = Infinity;
  names.forEach(n => {
    if(!ST[n]) return;
    const d = haversineKm(lat, lng, ST[n][0], ST[n][1]);
    if(d < bestD){ bestD = d; best = n; }
  });
  return best;
}

// จุดขึ้นรถขากลับ (ค่าเริ่มต้นตามวิธีเดินทาง): รถเมล์/เรียกรถผ่านแอป ใช้ป้ายฝั่งตรงข้าม มศว ได้ปกติ
// ส่วนวินมอเตอร์ไซค์ไม่มีคิวหน้ามอ ต้องเดินไปขึ้นที่แยกเพชรบุรี-อโศกซึ่งเป็นที่ตั้งวินจริง
const BUS_APP_PICKUP    = { lat:13.745787302693586, lng:100.56260548830315, label:"ป้ายรถฝั่งตรงข้าม มศว (อโศกทาวเวอร์)" };
const MOTORCYCLE_PICKUP = { lat:13.749050000788824, lng:100.56373497738878, label:"แยกเพชรบุรี-อโศก (จุดขึ้นวิน)" };
function defaultPickupFor(mode){
  if(mode === 'วินมอเตอร์ไซค์รับจ้าง') return MOTORCYCLE_PICKUP;
  if(mode === 'รถโดยสารประจำทาง' || mode === 'เรียกรถผ่านแอปพลิเคชั่น (Bike/Car)') return BUS_APP_PICKUP;
  return null; // โหมดอื่นไม่ทราบจุดขึ้นรถที่แน่ชัด ให้เดินตรงจากมศวไปที่พักตามปกติ
}

function buildSpans(h, direction){
  const raw = (direction==='to' ? h.routeToSteps : h.routeBackSteps) || [];
  const steps = raw.filter(s => s && s !== 'จบการเดินทาง').slice();
  const home = { lat:h.lat, lng:h.lng, label:'ที่พัก' };
  const uni  = { lat:UNI_GATE.lat, lng:UNI_GATE.lng, label:UNI_GATE.label };
  const start = direction==='to' ? home : uni;
  const end   = direction==='to' ? uni  : home;

  const spans = [];
  let cursor = start, pending = [];

  // ขากลับ: เดินไปจุดขึ้นรถที่ถูกต้องตามวิธีเดินทางก่อน (ไม่ต้องกลับรถ ค่าโดยสารถูกกว่า ตรงพฤติกรรมจริง)
  // ใช้ h.returnPickup เพื่อ override เฉพาะเคส ถ้าไม่ระบุจะเลือกจุดให้อัตโนมัติตามโหมด
  if(direction === 'back' && steps[0] === 'เดิน' && steps.length > 1 && !RAIL_MODES.includes(steps[1])){
    const pickup = h.returnPickup || defaultPickupFor(steps[1]);
    if(pickup){
      const pick = { lat:pickup.lat, lng:pickup.lng, label:pickup.label || 'จุดขึ้นรถ' };
      spans.push({ from:cursor, to:pick, steps:['เดิน'] });
      cursor = pick;
      steps.shift();
    }
  }

  steps.forEach(mode => {
    if(RAIL_MODES.includes(mode)){
      const homeSide = nearestStation(h.lat, h.lng, mode);
      const uniSide = (mode==='MRT') ? DEFAULT_UNI_STATION : nearestStation(UNI_GATE.lat, UNI_GATE.lng, mode);
      const bName = direction==='to' ? homeSide : uniSide;
      const aName = direction==='to' ? uniSide  : homeSide;
      if(!ST[bName] || !ST[aName]) return;
      const board  = { lat:ST[bName][0], lng:ST[bName][1], label:`${mode} ${stTh(bName)}` };
      const alight = { lat:ST[aName][0], lng:ST[aName][1], label:`${mode} ${stTh(aName)}` };
      if(pending.length) spans.push({ from:cursor, to:board, steps:pending.slice() });
      pending = [];
      spans.push({ from:board, to:alight, steps:[mode], rail:{ line:mode, a:bName, b:aName } });
      cursor = alight;
    } else {
      pending.push(mode);
    }
  });
  if(pending.length) spans.push({ from:cursor, to:end, steps:pending.slice() });
  return spans;
}

// เส้นรถไฟฟ้า: ไล่ผ่านสถานีระหว่างทางจริง ทำให้เส้นเกาะแนวรางไม่ตัดตรงข้ามเมือง
function stationSequence(lineKey, a, b){
  const order = LINES[lineKey];
  const mk = n => ({ lat:ST[n][0], lng:ST[n][1], name:n });
  if(!order) return [mk(a), mk(b)];
  const i = order.indexOf(a), j = order.indexOf(b);
  if(i === -1 || j === -1) return [mk(a), mk(b)];
  const slice = i <= j ? order.slice(i, j+1) : order.slice(j, i+1).reverse();
  return slice.filter(n => ST[n]).map(mk);
}

// แบ่งเส้น polyline ออกเป็นหลายท่อนตามสัดส่วนน้ำหนัก (ใช้ตอน 1 ช่วงมีหลายวิธีเดินทาง เช่น เดิน→รถเมล์→เดิน)
function polylineLengthKm(points){
  let t = 0;
  for(let i=1;i<points.length;i++) t += haversineKm(points[i-1][0],points[i-1][1],points[i][0],points[i][1]);
  return t;
}
// แบ่งเส้นออกเป็นหลายท่อนตามวิธีเดินทาง
// ช่วง "เดิน" จำกัดไม่เกิน 600 เมตรต่อท่อน เพื่อไม่ให้เส้นเดินยาวผิดความจริงเวลาอยู่คู่กับรถเมล์/วิน
const MAX_WALK_KM = 0.6;
function splitByModes(points, modes){
  if(modes.length === 1) return [points];
  const total = polylineLengthKm(points);
  if(total === 0) return modes.map(() => points);

  const walkCount = modes.filter(m => m === 'เดิน').length;
  const rideCount = modes.length - walkCount;
  let walkShare = Math.min(MAX_WALK_KM, total / (modes.length * 2));
  if(rideCount === 0) walkShare = total / modes.length;   // ทุกช่วงเป็นการเดิน แบ่งเท่า ๆ กัน
  const rideShare = rideCount ? (total - walkShare*walkCount) / rideCount : 0;
  const lens = modes.map(m => m === 'เดิน' ? walkShare : rideShare);

  const cuts = []; let acc = 0;
  lens.slice(0,-1).forEach(L => { acc += L; cuts.push(acc); });

  const out = []; let current = [points[0]]; let walked = 0, ci = 0;
  for(let i=1;i<points.length;i++){
    const d = haversineKm(points[i-1][0],points[i-1][1],points[i][0],points[i][1]);
    while(ci < cuts.length && walked + d >= cuts[ci]){
      const t = d === 0 ? 0 : (cuts[ci]-walked)/d;
      const lat = points[i-1][0] + (points[i][0]-points[i-1][0])*t;
      const lng = points[i-1][1] + (points[i][1]-points[i-1][1])*t;
      current.push([lat,lng]); out.push(current); current = [[lat,lng]]; ci++;
    }
    walked += d; current.push(points[i]);
  }
  out.push(current);
  while(out.length < modes.length) out.push([points[points.length-1]]);
  return out;
}

function typeIcon(t){ return ({ 'คอนโดมิเนียม':'🏢', 'อพาร์ตเมนต์':'🏨' })[t] || '📍'; }
function avgRating(h){
  if(!h.ratings) return null;
  const v = Object.values(h.ratings);
  return (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1);
}
function svCoords(h){
  return { lat: h.svLat !== undefined ? h.svLat : h.lat,

}
// OSRM
// เลือกโปรไฟล์ตามวิธีเดินทาง: เดิน=foot, วิน/เรียกรถ=bike (ขึ้นทางด่วนไม่ได้ จึงเกาะถนนพื้นราบตามจริง), รถเมล์/รถยนต์=car
function profileFor(mode){
  if(mode === 'เดิน') return 'foot';
  if(mode === 'วินมอเตอร์ไซค์รับจ้าง') return 'bike';
  if(mode === 'เรียกรถผ่านแอปพลิเคชั่น (Bike/Car)') return 'bike';
  return 'car';
}
async function fetchRoad(waypoints, profile){
  const coords = waypoints.map(w => `${w.lng},${w.lat}`).join(';');
  try{
    const url = `https://routing.openstreetmap.de/routed-${profile}/route/v1/driving/${coords}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data.routes && data.routes[0]) return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    throw new Error('no route');
  }catch(e){
    console.warn('[OSRM] ใช้เส้นตรงสำรอง:', e.message);
    return waypoints.map(w => [w.lat, w.lng]);
  }
}
let routeLayers = [];
let routeReq = 0;
function clearRoute(){ routeLayers.forEach(l => map.removeLayer(l)); routeLayers = []; }

// ทำให้เส้นหักมุมน้อยลง โค้งเอียงตามแนวสถานีจริง (Chaikin) — ใช้ได้ผลเมื่อมีสถานีระหว่างทาง 3 จุดขึ้นไป
function smoothLine(points, passes){
  let pts = points;
  for(let p=0; p<(passes||2); p++){
    if(pts.length < 3) return pts;
    const out = [pts[0]];
    for(let i=0;i<pts.length-1;i++){
      const a = pts[i], b = pts[i+1];
      out.push([a[0]+(b[0]-a[0])*0.25, a[1]+(b[1]-a[1])*0.25]);
      out.push([a[0]+(b[0]-a[0])*0.75, a[1]+(b[1]-a[1])*0.75]);
    }
    out.push(pts[pts.length-1]);
    pts = out;
  }
  return pts;
}
async function drawRoute(h, direction){
  const myReq = ++routeReq;
  clearRoute();
  const spans = buildSpans(h, direction);
  if(!spans.length) return;
  const bounds = [];

  for(const span of spans){
    let pts;
    if(span.rail){
      // รถไฟฟ้าวิ่งทางเดียวไม่กลับรถ จึงลากตามลำดับสถานีจริง (สถานีติดกัน 2 จุดจะเป็นเส้นตรง ถูกต้องแล้ว)
      const seq = stationSequence(span.rail.line, span.rail.a, span.rail.b);
      pts = smoothLine(seq.map(w => [w.lat, w.lng]), 2);
    } else {
      const rideMode = span.steps.find(s => s !== 'เดิน');
      pts = await fetchRoad([span.from, span.to], profileFor(rideMode || 'เดิน'));
    }
    if(myReq !== routeReq) return;

    const parts = splitByModes(pts, span.steps);
    span.steps.forEach((mode, k) => {
      const st = tStyle(mode);
      if(!parts[k] || parts[k].length < 2) return;
      const isWalk = mode === 'เดิน';
      const line = L.polyline(parts[k], { 
     color: st.color, 
     weight: isWalk ? 5 : 5.5, 
     opacity: 0.9, 
     lineCap: 'round',
      dashArray: isWalk ? '8, 8' : null // ถ้าเป็น 'เดิน' ให้เป็นเส้นประ (ความยาวเส้น 8px, เว้น 8px)
}).addTo(map);
      routeLayers.push(line);
      parts[k].forEach(p => bounds.push(p));
    });

    if(span.rail){
      [span.from, span.to].forEach(pt => {
        const st = tStyle(span.rail.line);
        const mk = L.marker([pt.lat, pt.lng], {
          icon: L.divIcon({ className:'', html:`<div class="station-dot" style="border-color:${st.color};color:${st.color}">${st.icon}</div>`, iconSize:[22,22] })
        }).addTo(map).bindTooltip(pt.label, { permanent:false });
        routeLayers.push(mk);
      });
    }
  }
  if(bounds.length) map.fitBounds(L.latLngBounds(bounds).pad(0.15));
}

const listEl = document.getElementById('list');
const sortSelect = document.getElementById('sortSelect');
const distFilter = document.getElementById('distFilter');
const typeFilter = document.getElementById('typeFilter');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchSuggest = document.getElementById('searchSuggest');
const sidebarEl = document.getElementById('mobileSheet');

function searchableText(h){
  const app = (h.appliances||[]).map(a=>a.name).join(' ');
  const sec = h.security ? Object.values(h.security).join(' ') : '';
  return [h.name,h.nameTh,h.type,h.quote,h.buildingCondition,app,sec,h.furnishing].filter(Boolean).join(' ').toLowerCase();
}
function hasAmenity(h, key){
  const has = n => (h.appliances||[]).some(a => a.name.includes(n));
  switch(key){
    case 'แอร์': return has('แอร์');
    case 'เตา': return has('เตา');
    case 'ตู้เย็น': return has('ตู้เย็น');
    case 'ทีวี': return has('TV');
    case 'เครื่องซักผ้าในห้อง': return !!(h.laundry && h.laundry.includes('ภายในห้องพัก'));
    case 'สระว่ายน้ำ': return h.pool === 'มี';
    case 'ฟิตเนส': return h.fitness === 'มี';
    case 'ลิฟต์': return h.elevator === 'มี';
    case 'ที่จอดรถ': return h.parking === 'มี';
    default: return true;
  }
}

function render(){
  let items = housing.map((h,i)=>({h,i}));
  const q = searchInput.value.trim().toLowerCase();
  if(q) items = items.filter(o => searchableText(o.h).includes(q));
  if(distFilter.value === 'near') items = items.filter(o => o.h.distanceKm <= 3);
  if(distFilter.value === 'far')  items = items.filter(o => o.h.distanceKm > 3);
  if(typeFilter.value !== 'all')  items = items.filter(o => o.h.type === typeFilter.value);
  const checked = Array.from(document.querySelectorAll('.amenityCheck:checked')).map(c=>c.dataset.amenity);
  if(checked.length) items = items.filter(o => checked.every(a => hasAmenity(o.h, a)));

  const s = sortSelect.value;
  if(s==='price-asc')  items.sort((a,b)=>a.h.rent-b.h.rent);
  if(s==='price-desc') items.sort((a,b)=>b.h.rent-a.h.rent);
  if(s==='dist-asc')   items.sort((a,b)=>a.h.distanceKm-b.h.distanceKm);
  if(s==='rating-desc')items.sort((a,b)=>avgRating(b.h)-avgRating(a.h));

  listEl.innerHTML = '';
  if(!items.length){
    listEl.innerHTML = `<div style="padding:30px 20px;text-align:center;color:var(--muted);font-size:12.5px;">ไม่พบที่พักตามเงื่อนไขที่เลือก<br>ลองปรับตัวกรองหรือคำค้นหาดูครับ</div>`;
    return;
  }
  items.forEach(({h,i}) => {
    const near = h.distanceKm <= 3;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <span class="name">${typeIcon(h.type)} ${h.name}${h.nameTh?`<span class="name-th">${h.nameTh}</span>`:''}</span>
        <span class="radius-tag ${near?'':'far'}">${h.distanceKm.toFixed(1)} กม.</span>
      </div>
      <div class="card-meta">${h.type} · ⭐ ${avgRating(h)}</div>
      <div class="card-price">${h.rent.toLocaleString()} บาท/เดือน</div>`;
    card.addEventListener('click', () => {
      map.setView([h.lat,h.lng], 15, { animate:true });
      markers[i].openPopup();
      clearRoute();
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      if(window.innerWidth <= 820) sidebarEl.classList.remove('expanded');
    });
    listEl.appendChild(card);
  });
}
render();
[sortSelect,distFilter,typeFilter].forEach(el=>el.addEventListener('change',render));
document.querySelectorAll('.amenityCheck').forEach(cb=>cb.addEventListener('change',render));

function highlightMatch(name,q){
  if(!q) return name;
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  if(i===-1) return name;
  return name.slice(0,i)+'<mark>'+name.slice(i,i+q.length)+'</mark>'+name.slice(i+q.length);
}
function updateSuggest(){
  const q = searchInput.value.trim();
  searchClear.style.display = q ? 'block' : 'none';
  render();
  if(!q){ searchSuggest.classList.remove('show'); return; }
  const ql = q.toLowerCase();
  const matches = housing.map((h,i)=>({h,i})).filter(o => searchableText(o.h).includes(ql)).slice(0,8);
  if(!matches.length){
    searchSuggest.innerHTML = `<div class="sg-empty">ไม่พบที่พักที่ตรงกับ "${q}"</div>`;
  } else {
    searchSuggest.innerHTML = matches.map(({h,i})=>`
      <div class="sg-item" data-index="${i}">
        <span>${typeIcon(h.type)}</span>
        <div>
          <div class="sg-name">${highlightMatch(h.name,q)}${h.nameTh?`<span class="name-th">${highlightMatch(h.nameTh,q)}</span>`:''}</div>
          <div class="sg-meta">${h.type} · ${h.rent.toLocaleString()} บาท · ${h.distanceKm.toFixed(1)} กม.</div>
        </div>
      </div>`).join('');
    searchSuggest.querySelectorAll('.sg-item').forEach(el=>{
      el.addEventListener('click',()=>{
        const i = parseInt(el.dataset.index), h = housing[i];
        map.setView([h.lat,h.lng],16,{animate:true});
        markers[i].openPopup(); clearRoute();
        searchInput.value = h.name; searchSuggest.classList.remove('show'); render();
        if(window.innerWidth <= 820) sidebarEl.classList.remove('expanded');
      });
    });
  }
  searchSuggest.classList.add('show');
}
searchInput.addEventListener('input',updateSuggest);
searchInput.addEventListener('focus',()=>{ if(searchInput.value.trim()) searchSuggest.classList.add('show'); });
document.addEventListener('click',e=>{ if(!e.target.closest('.search-wrap')) searchSuggest.classList.remove('show'); });
searchClear.addEventListener('click',()=>{ searchInput.value=''; searchClear.style.display='none'; searchSuggest.classList.remove('show'); render(); searchInput.focus(); });

function kv(l,v){ return (v===undefined||v===null||v==='') ? '' : `<div class="kv"><span class="k">${l}</span><span class="v">${v}</span></div>`; }
function tagList(a){ return (!a||!a.length) ? '' : `<div class="tag-wrap">${a.map(x=>`<span>${x}</span>`).join('')}</div>`; }
function starsRow(l,n){ return (n==null) ? '' : `<div class="stars-row"><span>${l}</span><span class="stars">${'⭐'.repeat(n)} (${n})</span></div>`; }

function routeChipsHTML(h, direction){
  const spans = buildSpans(h, direction);
  if(!spans.length) return '<div style="color:var(--muted);font-size:12px;">ไม่มีข้อมูล</div>';
  const chips = [];
  spans.forEach(sp => sp.steps.forEach(mode => {
    const st = tStyle(mode);
    const named = sp.rail ? `: ${stTh(sp.rail.a)} → ${stTh(sp.rail.b)}` : '';
    chips.push(`<span class="route-chip" style="background:${st.color}">${st.icon} ${st.label}${named}</span>`);
  }));
  return `<div class="route-flow">${chips.join('<span class="route-arrow">→</span>')}</div>`;
}

function routeCostHTML(h, direction){
  const cost = direction==='to' ? h.travelCostGo  : h.travelCostBack;
  const time = direction==='to' ? h.travelTimeGo  : h.travelTimeBack;
  const word = direction==='to' ? 'ขาไป' : 'ขากลับ';
  const costText = (cost !== undefined && cost !== '') ? Number(cost).toLocaleString()+' บาท' : 'ไม่มีข้อมูล';
  const timeText = (time !== undefined && time !== '') ? time+' นาที' : 'ไม่มีข้อมูล';
  return kv(`ค่าเดินทาง${word}`, costText) + kv(`เวลาเดินทาง${word}`, timeText);
}

let currentH = null;
function switchRouteTab(direction){
  if(!currentH) return;
  document.getElementById('routeTabTo').classList.toggle('active', direction==='to');
  document.getElementById('routeTabBack').classList.toggle('active', direction==='back');
  document.getElementById('routeChips').innerHTML = routeChipsHTML(currentH, direction);
  const cEl = document.getElementById('routeCost');
  if(cEl) cEl.innerHTML = routeCostHTML(currentH, direction);
  drawRoute(currentH, direction);
}

function openDrawer(i){
  const h = housing[i];
  currentH = h;
  clearRoute();

  document.getElementById('dBadges').innerHTML =
    `<span class="badge">${typeIcon(h.type)} ${h.type}</span>
     <span class="badge dist">${h.distanceKm.toFixed(1)} กม. จาก มศว</span>
     <span class="badge">⭐ ${avgRating(h)}</span>`;
  document.getElementById('dName').innerHTML = h.name + (h.nameTh?`<span class="name-th" style="margin-top:2px;">${h.nameTh}</span>`:'');
  document.getElementById('dArea').textContent = h.floor ? `ชั้น ${h.floor}` : '';
  document.getElementById('dRent').textContent = h.rent.toLocaleString();

  const sv = svCoords(h);
  let body = `<div style="padding:14px 22px 0;">
      <iframe src="https://www.google.com/maps/embed/v1/streetview?key=${GOOGLE_MAPS_API_KEY}&location=${sv.lat},${sv.lng}&heading=${sv.heading}&pitch=5&fov=80"
        style="width:100%;height:190px;border:0;border-radius:10px;display:block;" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>`;

  const p1 = kv('ประเภท',h.type)+kv('ขนาดห้อง',h.roomSize)+kv('ชั้น',h.floor)+kv('จำนวนผู้พัก',h.occupants)+kv('การตกแต่ง',h.furnishing)+kv('อาศัยมาแล้ว',h.stayDuration);
  body += `<details class="section" open><summary>ข้อมูลที่พัก</summary><div class="section-content">${p1}</div></details>`;

  const p2 = kv('รูปแบบจ่าย',h.paymentTiming)+kv('ค่าแรกเข้า',h.initialCost?h.initialCost.toLocaleString()+' บาท':'')+kv('ระยะสัญญา',h.contractDuration);
  body += `<details class="section"><summary>ค่าเช่าและสัญญา</summary><div class="section-content">${p2}</div></details>`;

  let wifiText = h.wifi;
  if(h.wifiExtraFee) wifiText += ` (+${h.wifiExtraFee} บาท/เดือน)`;
  if(h.wifiSource) wifiText += ` — ${h.wifiSource}`;
  if(h.wifiSelfCost) wifiText += ` (จ่ายเอง ${h.wifiSelfCost} บาท/เดือน)`;
  const p3 = kv('ค่าไฟ',h.electricity+(h.electricityNote?` (${h.electricityNote})`:''))
           + kv('ค่าน้ำ',h.water+(h.waterNote?` (${h.waterNote})`:''))
           + kv('ค่าส่วนกลาง',h.commonFee)+kv('อินเทอร์เน็ต/WiFi',wifiText);
  body += `<details class="section"><summary>ค่าน้ำ-ไฟ-ส่วนกลาง-เน็ต</summary><div class="section-content">${p3}</div></details>`;

  let p4 = `<div class="route-tabs">
      <div class="route-tab" id="routeTabTo" onclick="switchRouteTab('to')"> ขาไป มศว</div>
      <div class="route-tab" id="routeTabBack" onclick="switchRouteTab('back')"> ขากลับ ที่พัก</div>
    </div>
    <div id="routeChips" style="color:var(--muted);font-size:12px;">เลือก "ขาไป" หรือ "ขากลับ" เพื่อดูขั้นตอนและเส้นทางบนแผนที่</div>`;
  p4 += `<div id="routeCost"></div>`;
  body += `<details class="section" open><summary>การเดินทางไปกลับ ที่พัก-มศว</summary><div class="section-content">${p4}</div></details>`;

  const appTags = (h.appliances||[]).map(a => a.qty>1 ? `${a.name} ×${a.qty}` : a.name);
  const inRoomLaundry = h.laundry && h.laundry.includes('ภายในห้องพัก');
  if(inRoomLaundry) appTags.push('เครื่องซักผ้า');
  if(appTags.length) body += `<details class="section"><summary>เครื่องใช้ไฟฟ้าในห้อง</summary><div class="section-content">${tagList(appTags)}</div></details>`;

  let p5 = '';
  if(!inRoomLaundry){
    p5 += kv('เครื่องซักผ้า',h.laundry);
    p5 += kv('ระยะทางร้านซักรีด', h.laundryDistance ? h.laundryDistance+' เมตร' : '');
  }
  const fac = [];
  if(h.fitness === 'มี') fac.push('ฟิตเนส');
  if(h.pool === 'มี') fac.push('สระว่ายน้ำ'+(h.poolSize?` (${h.poolSize})`:''));
  if(h.elevator === 'มี') fac.push('ลิฟต์โดยสาร'+(h.elevatorCount?` (${h.elevatorCount} ตัว)`:''));
  if(h.parking === 'มี') fac.push('ที่จอดรถยนต์'+(h.parkingCount?` (${h.parkingCount} คัน)`:'')+(h.parkingFeeNote&&h.parkingFeeNote!=='ไม่มี/ไม่เก็บเพิ่ม'?` — ${h.parkingFeeNote}`:''));
  if(fac.length) p5 += tagList(fac);
  if(h.security) p5 += kv('เข้าตัวอาคาร',h.security.building)+kv('เข้าลิฟต์',h.security.elevator)+kv('เข้าห้องพัก',h.security.room);
  if(p5) body += `<details class="section"><summary>สิ่งอำนวยความสะดวกส่วนกลาง</summary><div class="section-content">${p5}</div></details>`;

  body += `<details class="section"><summary>สภาพอาคาร</summary><div class="section-content">${kv('สภาพอาคาร',h.buildingCondition)}</div></details>`;

  if(h.ratings){
    const r = h.ratings;
    const p7 = starsRow('ทำเลที่ตั้ง',r.location)+starsRow('ความสะอาด',r.cleanliness)+starsRow('ความปลอดภัย',r.safety)
             + starsRow('การบริการ',r.service)+starsRow('สิ่งอำนวยความสะดวก',r.facilities)+starsRow('ที่จอดรถ',r.parking)+starsRow('ความคุ้มค่ากับราคา',r.value);
    body += `<details class="section"><summary>คะแนนรีวิวรายด้าน (เฉลี่ย ⭐ ${avgRating(h)})</summary><div class="section-content">${p7}</div></details>`;
  }

  document.getElementById('dBody').innerHTML = body;

  let src = 'ผู้ตอบแบบสอบถาม';
  if(h.respondent){
    const r = h.respondent, parts = [];
    if(r.gender||r.age) parts.push(`นิสิต${r.gender||''}${r.age?' อายุ '+r.age+' ปี':''}`);
    if(r.faculty) parts.push(r.faculty);
    src = parts.join(', ') || src;
  }
  
  // ใช้ลิงก์ gmapsUrl ที่ระบุเอง หากไม่ได้ใส่ไว้จะดึงอัตโนมัติ
  const dirUrl = h.gmapsUrl || `https://www.google.com/maps/dir/?api=1&origin=${h.lat},${h.lng}&destination=${UNI_GATE.lat},${UNI_GATE.lng}&travelmode=transit`;
  
  const extra = document.createElement('div');
  extra.innerHTML = `
    ${h.quote?`<div class="quote-block">"${h.quote}"<div class="quote-src">— ${src}</div></div>`:''}
    <a class="gmaps-link" href="${dirUrl}" target="_blank" rel="noopener">🧭 ดูเส้นทางไปกลับที่พัก-มศว ใน Google Maps</a>`;
  document.getElementById('dBody').appendChild(extra);

  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  if(window.innerWidth <= 820) sidebarEl.classList.remove('expanded');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('overlay').addEventListener('click', closeDrawer);

(function initSheet(){
  const sheet = sidebarEl, handle = sheet && sheet.querySelector('.drag-handle');
  if(!sheet || !handle) return;
  let startY=0, dragging=false;
  handle.addEventListener('click', ()=> sheet.classList.toggle('expanded'));
  sheet.addEventListener('touchstart', e=>{
    if(e.target.closest('.list') && sheet.classList.contains('expanded')) return;
    startY = e.touches[0].clientY; dragging = true;
  }, {passive:true});
  sheet.addEventListener('touchmove', e=>{
    if(!dragging) return;
    const diff = e.touches[0].clientY - startY;
    if(diff > 50){ sheet.classList.remove('expanded'); dragging=false; }
    else if(diff < -50){ sheet.classList.add('expanded'); dragging=false; }
  }, {passive:true});
  sheet.addEventListener('touchend', ()=> dragging=false);
})();
</script>
</body>
</html>
