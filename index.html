<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนที่ที่พักรอบ มศว ประสานมิตร</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#1c1a15; --red:#DA2128; --gray:#636466;
    --paper:#f5f1e8; --panel:#fffdf9; --line:#e4dcc5;
    --emerald:#0f4d3a; --emerald-deep:#0a352a;
    --gold:#b98b3e; --gold-light:#f0dfb0; --muted:#8b8371;
    --warn-bg:#fbf1e4; --warn-line:#e0b877; --warn-text:#8a5a24;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%;
    font-family:"IBM Plex Sans Thai","Noto Sans Thai","IBM Plex Sans",sans-serif;
    background:var(--paper); color:var(--ink);
  }
  .app{ display:grid; grid-template-columns: 350px 1fr; height:100vh; position:relative; overflow:hidden; }

  .sidebar{ border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; overflow:hidden; }
  .sb-head{ padding:22px 20px 14px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#fffdf9,#f9f4e9); }
  .eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:0 0 6px; }
  .sb-head h1{ font-size:19px; line-height:1.35; margin:0 0 8px; color:var(--emerald-deep); font-weight:700; }
  .sb-head p{ font-size:12.5px; color:var(--muted); margin:0; line-height:1.6; }
  .legend{ display:flex; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
  .legend span{display:flex; align-items:center; gap:6px;}
  .swatch-ring{width:14px; height:14px; border-radius:50%; display:inline-block; border:2px solid;}

  .search-wrap{ position:relative; padding:12px 20px 0; background:#fbf8f1; border-bottom:1px solid var(--line); }
  .search-box{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:12px; }
  .search-box:focus-within{ border-color:var(--gold); }
  .search-icon{ font-size:13px; opacity:.6; }
  .search-box input{ flex:1; border:none; outline:none; font-size:13px; font-family:inherit; background:transparent; color:var(--ink); }
  .search-clear{ cursor:pointer; color:var(--muted); font-size:12px; padding:2px 4px; }
  .search-suggest{ position:absolute; left:20px; right:20px; top:100%; z-index:50; background:var(--panel); border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px; box-shadow:0 10px 24px rgba(15,77,58,.15); max-height:260px; overflow-y:auto; display:none; }
  .search-suggest.show{ display:block; }
  .search-suggest .sg-item{ display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--line); }
  .search-suggest .sg-item:last-child{ border-bottom:none; }
  .search-suggest .sg-item:hover{ background:#f2ecd9; }
  .search-suggest .sg-name{ font-size:12.5px; font-weight:600; color:var(--emerald-deep); }
  .search-suggest .sg-name mark{ background:var(--gold-light); color:var(--emerald-deep); border-radius:2px; }
  .search-suggest .sg-meta{ font-size:11px; color:var(--muted); }
  .search-suggest .sg-empty{ padding:14px; text-align:center; font-size:12px; color:var(--muted); }

  .controls{ padding:12px 20px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; background:#fbf8f1; }
  .controls .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .controls select{ flex:1; min-width:0; padding:8px 10px; font-size:12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-family:inherit; cursor:pointer; }
  .controls select:focus{ outline:2px solid var(--gold); }
  .amenity-filters{ margin-top:2px; }
  .amenity-filters summary{ list-style:none; cursor:pointer; font-size:11.5px; color:var(--emerald-deep); font-weight:700; padding:4px 0; }
  .amenity-filters summary::-webkit-details-marker{ display:none; }
  .amenity-grid{ display:flex; flex-wrap:wrap; gap:6px 10px; padding:6px 2px 2px; }
  .amenity-grid label{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink); cursor:pointer; }
  .amenity-grid input{ accent-color:var(--emerald); cursor:pointer; }

  .list{ flex:1; overflow-y:auto; padding:6px 0; }
  .card{ padding:14px 20px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s; }
  .card:hover, .card.selected{ background:#f2ecd9; }
  .card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .card-top .name{ font-weight:700; font-size:14px; color:var(--emerald-deep);}
  .name-th{ font-size:11px; color:var(--muted); font-weight:500; display:block; }
  .card-top .radius-tag{ font-size:10.5px; padding:2px 8px; border-radius:10px; white-space:nowrap; background:#e4f0e9; color:var(--emerald-deep); font-weight:600; }
  .card-top .radius-tag.far{ background:var(--gold-light); color:#7a5a1e;}
  .card-meta{ font-size:12px; color:var(--muted); margin-top:4px; }
  .card-price{ font-size:13px; margin-top:6px; color:var(--gold); font-weight:700;}
  .sb-foot{ padding:12px 20px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }

  #map{ width:100%; height:100%; background:#eae7dc; }
  .leaflet-popup-content-wrapper{ background:var(--panel); border-radius:12px; box-shadow:0 10px 28px rgba(15,77,58,.22); }
  .leaflet-popup-tip{ background:var(--panel); }
  .leaflet-popup-content{ margin:10px 12px !important; }
  .mini-popup{ font-family:inherit; width:100%; max-width:240px; }
  .mini-popup .sv-wrap{ position:relative; margin-bottom:8px; }
  .mini-popup .sv-thumb{ width:100%; height:100px; border:0; border-radius:8px; display:block; }
  .mini-popup .rating-badge{
    position:absolute; top:6px; right:6px; background:rgba(10,53,42,0.88); color:#f0dfb0;
    font-size:11px; font-weight:800; padding:3px 8px; border-radius:10px; display:flex; align-items:center; gap:3px;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .mini-popup h3{ margin:0 0 2px; font-size:14.5px; color:var(--emerald-deep); }
  .mini-popup .area{ font-size:11.5px; color:var(--muted); margin-bottom:4px; }
  .mini-popup .rent{ font-size:16px; font-weight:800; color:var(--gold); margin-bottom:6px; }
  .mini-popup .review{ font-size:11px; font-style:italic; color:var(--ink); background:#fbf8f1; border-left:2.5px solid var(--gold); padding:5px 8px; margin-bottom:9px; line-height:1.5; max-height:80px; overflow-y:auto; white-space:normal; }
  .mini-popup button{ width:100%; padding:8px 0; border:none; border-radius:8px; background:var(--emerald); color:#fff; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .mini-popup button:hover{ background:var(--emerald-deep); }

  .center-badge{ width:38px; height:38px; border-radius:50%; background:var(--red); border:3px solid #fff; box-shadow:0 3px 10px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; font-size:19px; }
  .pin-badge{ width:34px; height:34px; border-radius:50% 50% 50% 4px; transform:rotate(-45deg); border:2.5px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .pin-badge .pin-icon{ transform:rotate(45deg); font-size:16px; line-height:1; }
  .pin-near{ background:var(--emerald); }
  .pin-far{ background:var(--gold); }
  .route-waypoint{ width:12px; height:12px; border-radius:50%; border:2px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,.35); }

  .drawer-overlay{ position:absolute; inset:0; background:rgba(15,77,58,.28); opacity:0; pointer-events:none; transition:opacity .25s; z-index:1600; }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:absolute; top:0; right:0; height:100%; width:430px; max-width:92vw; background:var(--panel); box-shadow:-12px 0 30px rgba(15,77,58,.25); transform:translateX(100%); transition:transform .3s ease; z-index:1601; display:flex; flex-direction:column; }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ padding:22px 22px 16px; border-bottom:1px solid var(--line); position:relative; background:#fbf8f1; }
  .drawer-close{ position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:16px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .drawer-close:hover{ background:#eee; }
  .badge-row{ display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .badge{ font-size:10.5px; padding:3px 9px; border-radius:10px; background:#e4f0e9; color:var(--emerald-deep); font-weight:600; }
  .badge.dist{ background:var(--gold-light); color:#7a5a1e; }
  .drawer-head h2{ margin:0 0 4px; font-size:19px; color:var(--emerald-deep); font-weight:700; }
  .drawer-head .area{ font-size:12.5px; color:var(--muted); }
  .drawer-price{ padding:18px 22px; background:linear-gradient(135deg,var(--emerald-deep),var(--emerald)); border-bottom:1px solid var(--line); }
  .drawer-price .amount{ font-size:26px; font-weight:800; color:var(--gold-light); }
  .drawer-price .unit{ font-size:12.5px; color:#d8e6de; margin-left:4px; }
  .drawer-price .note{ font-size:11.5px; color:#cfe0d6; margin-top:4px; line-height:1.5; }
  .drawer-body{ flex:1; overflow-y:auto; padding:10px 0 20px; }

  details.section{ border-bottom:1px solid var(--line); }
  details.section summary{ list-style:none; cursor:pointer; padding:13px 22px; font-size:13px; font-weight:700; color:var(--emerald-deep); display:flex; align-items:center; justify-content:space-between; }
  details.section summary::-webkit-details-marker{ display:none; }
  details.section summary::after{ content:'+'; font-size:16px; color:var(--gold); font-weight:700; }
  details.section[open] summary::after{ content:'–'; }
  details.section[open] summary{ background:#fbf8f1; }
  .section-content{ padding:2px 22px 16px; font-size:12.5px; }
  .kv{ display:flex; padding:5px 0; gap:10px; border-bottom:1px dashed #eee; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ width:120px; flex-shrink:0; color:var(--muted); }
  .kv .v{ font-weight:600; color:var(--ink); word-break:break-word; }
  .tag-wrap{ display:flex !important; flex-wrap:wrap !important; gap:6px !important; width:100% !important; margin-top:4px; }
  .tag-wrap span{ font-size:11px; background:#e4f0e9; color:var(--emerald-deep); padding:3px 9px; border-radius:8px; white-space:normal !important; line-height:1.4; }
  .tag-wrap span.no{ background:var(--gold-light); color:#7a5a1e; }
  .quote-block{ margin:14px 22px 0; font-size:12.5px; font-style:italic; color:var(--ink); background:#fbf8f1; border-left:3px solid var(--gold); padding:10px 12px; line-height:1.6; }
  .quote-src{ font-size:10.5px; color:var(--muted); text-align:right; margin-top:6px; font-style:normal; }
  .gmaps-link{ display:flex; align-items:center; justify-content:center; gap:7px; margin:16px 22px 4px; padding:11px 0; border-radius:9px; background:var(--emerald); color:#fff; text-decoration:none; font-size:13px; font-weight:600; }
  .gmaps-link:hover{ background:var(--emerald-deep); }
  .gmaps-link svg{ width:14px; height:14px; }

  .route-tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .route-tab{ flex:1; padding:7px 0; text-align:center; font-size:12px; font-weight:700; border-radius:8px; border:1.5px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer; }
  .route-tab.active{ background:var(--emerald); color:#fff; border-color:var(--emerald); }
  .route-flow{ display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .route-chip{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:#fff; padding:4px 9px; border-radius:12px; white-space:nowrap; }
  .route-arrow{ color:var(--muted); font-size:12px; }
  .stars-row{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed #eee; font-size:12px; }
  .stars-row:last-child{ border-bottom:none; }
  .stars-row .stars{ color:var(--gold); font-weight:700; }

  @media (max-width: 820px) {
    html, body{ overflow:hidden !important; height:100% !important; position:fixed !important; width:100% !important; }
    .app{ display:block !important; position:relative !important; height:100dvh !important; width:100vw !important; overflow:hidden !important; }
    #map{ position:absolute !important; top:0; left:0; width:100% !important; height:100% !important; z-index:1; }
    .sidebar{
      position:absolute !important; left:0; right:0; bottom:0; z-index:10;
      height:82dvh !important; transform:translateY(calc(100% - 130px));
      transition:transform 0.3s cubic-bezier(0.25,1,0.5,1);
      background:var(--panel) !important; border-radius:20px 20px 0 0 !important;
      box-shadow:0 -4px 20px rgba(0,0,0,0.2) !important;
      display:flex !important; flex-direction:column !important; overflow:hidden !important;
    }
    .drag-handle{ width:40px; height:5px; background:#ccc; border-radius:3px; margin:8px auto 4px; flex-shrink:0; cursor:grab; }
    .sidebar.expanded{ transform:translateY(0) !important; }
    .sb-head{ padding:4px 16px 6px !important; }
    .sb-head h1{ font-size:15px !important; margin:0 !important; }
    .sb-head p, .eyebrow{ display:none !important; }
    .legend{ padding:4px 16px !important; font-size:10.5px !important; }
    .controls{ padding:6px 16px !important; }
    .search-wrap{ padding:8px 16px 0 !important; }
    .list{ flex:1 !important; overflow-y:auto !important; -webkit-overflow-scrolling:touch !important; padding:10px 16px 30px !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="mobileSheet">
    <div class="drag-handle"></div>
    <div class="sb-head">
      <p class="eyebrow">ผลสำรวจและงานวิจัย</p>
      <h1>ที่พักรอบมหาวิทยาลัยศรีนครินทรวิโรฒ ประสานมิตร</h1>
      <p>แสดงพิกัดที่พักในระยะ 3 กม. และ 6 กม. จากสนามกีฬากลาง มศว พร้อมข้อมูลจากผู้พักอาศัยจริง</p>
    </div>
    <div class="legend">
      <span><span class="swatch-ring" style="border-color:var(--gray);background:var(--red)"></span>มศว ประสานมิตร</span>
      <span><span class="swatch-ring" style="border-color:var(--emerald);background:#bfe0cd"></span> 3 กม.</span>
      <span><span class="swatch-ring" style="border-color:var(--gold);background:var(--gold-light)"></span> 6 กม.</span>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อที่พัก..." autocomplete="off">
        <span class="search-clear" id="searchClear" style="display:none">✕</span>
      </div>
      <div class="search-suggest" id="searchSuggest"></div>
    </div>
    <div class="controls">
      <div class="row">
        <select id="sortSelect">
          <option value="default">เรียงตาม: ค่าเริ่มต้น</option>
          <option value="price-asc">ราคา: ต่ำ → สูง</option>
          <option value="price-desc">ราคา: สูง → ต่ำ</option>
          <option value="dist-asc">ระยะทาง: ใกล้ → ไกล</option>
        </select>
      </div>
      <div class="row">
        <select id="distFilter">
          <option value="all">ระยะ: ทั้งหมด</option>
          <option value="near">ในวง 3 กม.</option>
          <option value="far">3–6 กม.</option>
        </select>
        <select id="typeFilter">
          <option value="all">ประเภท: ทั้งหมด</option>
          <option value="คอนโดมิเนียม">คอนโดมิเนียม</option>
          <option value="อะพาร์ตเมนต์">อะพาร์ตเมนต์</option>
        </select>
      </div>
      <details class="amenity-filters">
        <summary>+ ตัวกรองเพิ่มเติม (สิ่งอำนวยความสะดวก)</summary>
        <div class="amenity-grid">
          <label><input type="checkbox" data-amenity="แอร์" class="amenityCheck"> มีแอร์</label>
          <label><input type="checkbox" data-amenity="เตา" class="amenityCheck"> มีเตาทำอาหาร</label>
          <label><input type="checkbox" data-amenity="ตู้เย็น" class="amenityCheck"> มีตู้เย็น</label>
          <label><input type="checkbox" data-amenity="เครื่องซักผ้าในห้อง" class="amenityCheck"> เครื่องซักผ้าในห้อง</label>
          <label><input type="checkbox" data-amenity="สระว่ายน้ำ" class="amenityCheck"> มีสระว่ายน้ำ</label>
          <label><input type="checkbox" data-amenity="ฟิตเนส" class="amenityCheck"> มีฟิตเนส</label>
          <label><input type="checkbox" data-amenity="ที่จอดรถ" class="amenityCheck"> มีที่จอดรถ</label>
        </div>
      </details>
    </div>
    <div class="list" id="list"></div>
    <div class="sb-foot">คลิกหมุดหรือรายการ เพื่อดูรายละเอียดจากแบบสอบถามวิจัย</div>
  </aside>

  <div id="map"></div>

  <div class="drawer-overlay" id="overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <button class="drawer-close" id="drawerClose">✕</button>
      <div class="badge-row" id="dBadges"></div>
      <h2 id="dName"></h2>
      <div class="area" id="dArea"></div>
    </div>
    <div class="drawer-price">
      <span class="amount" id="dRent"></span><span class="unit">บาท / เดือน</span>
      <div class="note" id="dRentNote"></div>
    </div>
    <div class="drawer-body" id="dBody"></div>
  </div>
</div>

<script>
const CENTER = [13.744982862662434, 100.56469591898168];
// จุดหน้ามหาวิทยาลัย ใช้เป็นจุดเริ่ม/สิ้นสุดของ "เส้นทางการเดินทาง" โดยเฉพาะ (คนละจุดกับ CENTER ที่ใช้วาดวงรัศมี 3/6 กม.)
const UNI_GATE = { lat: 13.745008896871706, lng: 100.56260886539863, label: "มศว ประสานมิตร" };
const GOOGLE_MAPS_API_KEY = "AIzaSyDbWLSw01m60YRiHBu_BOmcejMoDwy1VNE";

// พิกัดสถานีขนส่งสาธารณะ (ใช้ตอนสร้าง route waypoint ให้ที่พักอื่น ๆ ต่อได้)
const STATIONS = {
  'MRT เพชรบุรี':          { lat: 13.7484838, lng: 100.5634913 },
  'MRT พระราม 9':          { lat: 13.75719441255959,  lng: 100.56520406911824 },
  'MRT ศูนย์วัฒนธรรมฯ':     { lat: 13.766224680662813, lng: 100.5703080869481 },
  'MRT ห้วยขวาง':          { lat: 13.778469691738785, lng: 100.57365628401017 },
  'MRT สุทธิสาร':          { lat: 13.78974263334204,  lng: 100.57419196178506 },
  'Airport Link มักกะสัน':  { lat: 13.75119391112395,  lng: 100.5604649164395 },
  'Airport Link ราชปรารภ':  { lat: 13.7550148131929,   lng: 100.54210804067947 },
  'Airport Link หัวหมาก':   { lat: 13.7383882166039,   lng: 100.64018781135151 }
};

function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// สีและไอคอนของแต่ละประเภทการเดินทาง (อิงสีจริงของสายรถไฟฟ้า)
const TRANSPORT_STYLE = {
  'เดิน':                                 { icon:'🚶', color:'#8b5e34', label:'เดิน' },
  'MRT':                                  { icon:'🚇', color:'#1f4e9c', label:'MRT' },
  'BTS':                                  { icon:'🚈', color:'#0a7a3d', label:'BTS' },

// แปลง routeToSimple/routeBackSimple (แค่ชื่อโหมด) ให้เป็นรูปแบบ route จุดแวะ (ที่พัก<->มศว เส้นตรง) อัตโนมัติ
function normalizeRoute(h, simpleArr, houseIsStart){
  const real = (simpleArr || []).filter(s => s && s !== 'จบการเดินทาง');
  if(!real.length) return null;
  const startPt = houseIsStart ? {label:'ที่พัก', lat:h.lat, lng:h.lng} : {label:UNI_GATE.label, lat:UNI_GATE.lat, lng:UNI_GATE.lng};
  const endPt   = houseIsStart ? {label:UNI_GATE.label, lat:UNI_GATE.lat, lng:UNI_GATE.lng} : {label:'ที่พัก', lat:h.lat, lng:h.lng};
  // ไม่มีจุดแวะจริง ใช้โหมดแรกที่ไม่ใช่เดินเป็นสีเส้น แสดงเป็นเส้นเดียว
  return [ startPt, { mode: real.find(s=>s!=='เดิน') || real[0], label: endPt.label, lat: endPt.lat, lng: endPt.lng } ];
}
function getRoute(h, direction){
  if(direction === 'to') return h.routeTo || normalizeRoute(h, h.routeToSimple, true);
  return h.routeBack || normalizeRoute(h, h.routeBackSimple, false);
}
function routeModesForChips(h, direction){
  // คืนค่ารายการ {mode, fromLabel, toLabel} สำหรับแสดงเป็น chip พร้อมชื่อสถานี (ถ้ามี)
  const route = getRoute(h, direction);
  if(!route) return [];
  const chips = [];
  for(let i=1;i<route.length;i++){
    chips.push({ mode: route[i].mode, fromLabel: route[i-1].label, toLabel: route[i].label });
  }
  return chips;
}

function typeIcon(type){
  const icons = { 'คอนโดมิเนียม': '🏢', 'อะพาร์ตเมนต์': '🏨' };
  return icons[type] || '📍';
}
function avgRating(h){
  if(!h.ratings) return null;
  const vals = Object.values(h.ratings);
  return (vals.reduce((a,b)=>a+b,0) / vals.length).toFixed(1);
}
// พิกัด Street View แยกจากพิกัดหมุด/คำนวณระยะทาง — ใช้กรณีพิกัดจริงชี้เข้าไปในตึก/มุมกล้องไม่ตรง
// ใส่ svLat/svLng/svHeading ในข้อมูลที่พักเพื่อ override ได้ทีละที่
function svCoords(h){
  return {
    lat: h.svLat !== undefined ? h.svLat : h.lat,
    lng: h.svLng !== undefined ? h.svLng : h.lng,
    heading: h.svHeading !== undefined ? h.svHeading : 210
  };
}
function searchableText(h){
  const applianceNames = (h.appliances || []).map(a => a.name).join(' ');
  const securityText = h.security ? Object.values(h.security).join(' ') : '';
  return [h.name, h.nameTh, h.type, h.quote, h.buildingCondition, applianceNames, securityText]
    .filter(Boolean).join(' ').toLowerCase();
}
function hasAmenity(h, key){
  switch(key){
    case 'แอร์': return (h.appliances||[]).some(a => a.name.includes('แอร์'));
    case 'เตา': return (h.appliances||[]).some(a => a.name.includes('เตา'));
    case 'ตู้เย็น': return (h.appliances||[]).some(a => a.name.includes('ตู้เย็น'));
    case 'เครื่องซักผ้าในห้อง': return !!(h.laundry && h.laundry.includes('ภายในห้องพัก'));
    case 'สระว่ายน้ำ': return h.pool === 'มี';
    case 'ฟิตเนส': return h.fitness === 'มี';
    case 'ที่จอดรถ': return h.parking === 'มี';
    default: return true;
  }
}

let routeLayers = [];
let routeRequestId = 0;
function clearRoute(){ routeLayers.forEach(l => map.removeLayer(l)); routeLayers = []; }

// เส้นโค้งเบา ๆ สำหรับช่วงที่ไม่มีถนนให้เกาะ (เช่น MRT ใต้ดิน) แทนเส้นตรงกระด้าง
function curvedPoints(from, to, bend){
  bend = bend === undefined ? 0.12 : bend;
  const dx = to.lng - from.lng, dy = to.lat - from.lat;
  const midLat = (from.lat + to.lat) / 2 - dx * bend;
  const midLng = (from.lng + to.lng) / 2 + dy * bend;
  const pts = [];
  for(let t = 0; t <= 1.0001; t += 0.05){
    const lat = (1-t)*(1-t)*from.lat + 2*(1-t)*t*midLat + t*t*to.lat;
    const lng = (1-t)*(1-t)*from.lng + 2*(1-t)*t*midLng + t*t*to.lng;
    pts.push([lat, lng]);
  }
  return pts;
}

// เรียก OSRM (ฟรี ไม่ต้องมี API key) ให้คำนวณเส้นทางเกาะถนนจริง
// เดิน -> ใช้โปรไฟล์ foot (เดินเท้า), โหมดอื่นทั้งหมด (MRT/BTS/รถ ฯลฯ) -> ใช้โปรไฟล์ car เพราะส่วนใหญ่วิ่งไปตามถนน/แนวราง
// หมายเหตุ: เปิดไฟล์แบบ file:// ตรงๆ เบราว์เซอร์จะบล็อกการเรียกนี้เสมอ ต้องทดสอบผ่านเว็บที่อัปโหลดจริง (https://) เท่านั้น
async function fetchRoadRoute(from, to, mode){
  const profile = mode === 'เดิน' ? 'foot' : 'car';
  try{
    const url = `https://routing.openstreetmap.de/routed-${profile}/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(data && data.routes && data.routes[0]){
      return { points: data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), routed:true };
    }
    throw new Error('ไม่มีข้อมูลเส้นทางในผลลัพธ์');
  }catch(e){
    console.warn(`[เส้นทาง:${mode}] เรียก OSRM (${profile}) ไม่สำเร็จ ใช้เส้นโค้งสำรองแทน — ถ้าเปิดไฟล์แบบ file:// ตรงๆ นี่คือสาเหตุที่พบบ่อยที่สุด (ลองเปิดผ่านเว็บที่ deploy จริงแทน):`, e);
    return { points: curvedPoints(from, to), routed:false };
  }
}

async function drawRoute(h, direction){
  const myRequestId = ++routeRequestId;
  clearRoute();
  const route = getRoute(h, direction || 'to');
  if(!route) return;

  for(let i=1;i<route.length;i++){
    const from = route[i-1], to = route[i];
    const st = tStyle(to.mode);
    const result = await fetchRoadRoute(from, to, to.mode);
    if(myRequestId !== routeRequestId) return; // ผู้ใช้คลิกที่อื่นไปแล้วระหว่างรอโหลด ยกเลิกการวาดทิ้ง
    const line = L.polyline(result.points, {
      color:st.color, weight:4.5, opacity:0.85, lineCap:'round',
      dashArray: result.routed ? null : '2 8' // เส้นประ = เกาะถนนไม่สำเร็จ ใช้เส้นโค้งสำรอง
    }).addTo(map);
    routeLayers.push(line);
    if(i < route.length - 1){
      const wp = L.marker([to.lat,to.lng], {
        icon: L.divIcon({ className:'', html:`<div class="route-waypoint" style="background:${st.color}"></div>`, iconSize:[12,12] })
      }).addTo(map).bindTooltip(to.label, { permanent:false });
      routeLayers.push(wp);
    }
  }
}

const listEl = document.getElementById('list');
const sortSelect = document.getElementById('sortSelect');
const distFilter = document.getElementById('distFilter');
const typeFilter = document.getElementById('typeFilter');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const searchSuggest = document.getElementById('searchSuggest');
const sidebarEl = document.getElementById('mobileSheet');

function render(){
  let items = housing.map((h, i) => ({ h, i }));

  const q = searchInput.value.trim().toLowerCase();
  if(q) items = items.filter(o => searchableText(o.h).includes(q));

  const dist = distFilter.value;
  if(dist === 'near') items = items.filter(o => o.h.distanceKm <= 3);
  if(dist === 'far') items = items.filter(o => o.h.distanceKm > 3);

  const type = typeFilter.value;
  if(type !== 'all') items = items.filter(o => o.h.type === type);

  const checkedAmenities = Array.from(document.querySelectorAll('.amenityCheck:checked')).map(cb => cb.dataset.amenity);
  if(checkedAmenities.length) items = items.filter(o => checkedAmenities.every(a => hasAmenity(o.h, a)));

  const sort = sortSelect.value;
  if(sort === 'price-asc') items.sort((a,b) => a.h.rent - b.h.rent);
  if(sort === 'price-desc') items.sort((a,b) => b.h.rent - a.h.rent);
  if(sort === 'dist-asc') items.sort((a,b) => a.h.distanceKm - b.h.distanceKm);

  listEl.innerHTML = '';
  if(!items.length){
    listEl.innerHTML = `<div style="padding:30px 20px; text-align:center; color:var(--muted); font-size:12.5px;">ไม่พบที่พักตามเงื่อนไขที่เลือก<br>ลองปรับตัวกรองหรือคำค้นหาดูครับ</div>`;
    return;
  }
  items.forEach(({h, i}) => {
    const near = h.distanceKm <= 3;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <span class="name">${typeIcon(h.type)} ${h.name}${h.nameTh ? `<span class="name-th">${h.nameTh}</span>` : ''}</span>
        <span class="radius-tag ${near ? '' : 'far'}">${h.distanceKm.toFixed(1)} กม.</span>
      </div>
      <div class="card-meta">${h.type}</div>
      <div class="card-price">${h.rent.toLocaleString()} บาท/เดือน</div>
    `;
    card.addEventListener('click', () => {
      map.setView([h.lat, h.lng], 15, { animate:true });
      markers[i].openPopup();
      clearRoute();
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      if(window.innerWidth <= 820) sidebarEl.classList.remove('expanded');
    });
    listEl.appendChild(card);
  });
}
render();
[sortSelect, distFilter, typeFilter].forEach(el => el.addEventListener('change', render));
document.querySelectorAll('.amenityCheck').forEach(cb => cb.addEventListener('change', render));

function highlightMatch(name, q){
  if(!q) return name;
  const idx = name.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return name;
  return name.slice(0, idx) + '<mark>' + name.slice(idx, idx+q.length) + '</mark>' + name.slice(idx+q.length);
}
function updateSuggest(){
  const q = searchInput.value.trim();
  searchClear.style.display = q ? 'block' : 'none';
  render();
  if(!q){ searchSuggest.classList.remove('show'); searchSuggest.innerHTML=''; return; }
  const matches = housing.map((h, i) => ({ h, i }))
    .filter(o => o.h.name.toLowerCase().includes(q.toLowerCase()) || (o.h.nameTh && o.h.nameTh.toLowerCase().includes(q.toLowerCase())))
    .slice(0, 8);
  if(!matches.length){
    searchSuggest.innerHTML = `<div class="sg-empty">ไม่พบที่พักชื่อ "${q}"</div>`;
  } else {
    searchSuggest.innerHTML = matches.map(({h, i}) => `
      <div class="sg-item" data-index="${i}">
        <span>${typeIcon(h.type)}</span>
        <div>
          <div class="sg-name">${highlightMatch(h.name, q)}${h.nameTh ? `<span class="name-th">${highlightMatch(h.nameTh, q)}</span>` : ''}</div>
          <div class="sg-meta">${h.type} · ${h.rent.toLocaleString()} บาท/เดือน · ${h.distanceKm.toFixed(1)} กม.</div>
        </div>
      </div>
    `).join('');
    searchSuggest.querySelectorAll('.sg-item').forEach(el => {
      el.addEventListener('click', () => {
        const i = parseInt(el.dataset.index);
        const h = housing[i];
        map.setView([h.lat, h.lng], 16, { animate:true });
        markers[i].openPopup();
        clearRoute();
        searchInput.value = h.name;
        searchSuggest.classList.remove('show');
        render();
        if(window.innerWidth <= 820) sidebarEl.classList.remove('expanded');
      });
    });
  }
  searchSuggest.classList.add('show');
}
searchInput.addEventListener('input', updateSuggest);
searchInput.addEventListener('focus', () => { if(searchInput.value.trim()) searchSuggest.classList.add('show'); });
document.addEventListener('click', (e) => { if(!e.target.closest('.search-wrap')) searchSuggest.classList.remove('show'); });
searchClear.addEventListener('click', () => {
  searchInput.value = ''; searchClear.style.display = 'none'; searchSuggest.classList.remove('show'); render(); searchInput.focus();
});

// Detail Drawer
// ==================================================================
function kv(label, value){
  if(value === undefined || value === null || value === '') return '';
  return `<div class="kv"><span class="k">${label}</span><span class="v">${value}</span></div>`;
}
function tagList(arr){
  if(!arr || !arr.length) return '';
  return `<div class="tag-wrap">${arr.map(a=>`<span>${a}</span>`).join('')}</div>`;
}
function routeChipsHTML(h, direction){
  const chips = routeModesForChips(h, direction);
  if(!chips.length) return '<div style="color:var(--muted);font-size:12px;">ไม่มีข้อมูล</div>';
  return `<div class="route-flow">${chips.map((c, idx) => {
    const st = tStyle(c.mode);
    const named = (c.fromLabel && c.toLabel && st.label !== 'เดิน') ? `: ${c.fromLabel} → ${c.toLabel}` : '';
    const arrow = idx < chips.length - 1 ? '<span class="route-arrow">→</span>' : '';
    return `<span class="route-chip" style="background:${st.color}">${st.icon} ${st.label}${named}</span>${arrow}`;
  }).join('')}</div>`;
}
function starsRow(label, n){
  if(n === undefined || n === null) return '';
  return `<div class="stars-row"><span>${label}</span><span class="stars">${'⭐'.repeat(n)} (${n})</span></div>`;
}
function routeCostHTML(h, direction){
  const cost = direction === 'to' ? h.travelCostGo : h.travelCostBack;
  if(cost !== undefined && cost !== ''){
    return `<div class="kv"><span class="k">ค่าใช้จ่าย${direction === 'to' ? 'ขาไป' : 'ขากลับ'}</span><span class="v">${Number(cost).toLocaleString()} บาท</span></div>`;
  }
  if(h.travelCostDay !== undefined && h.travelCostDay !== ''){
    return `<div class="kv"><span class="k">ค่าใช้จ่ายไป-กลับ</span><span class="v">${Number(h.travelCostDay).toLocaleString()} บาท/วัน (รวม ยังไม่แยกทิศทาง)</span></div>`;
  }
  return '';
}

let currentDrawerHousing = null;
function switchRouteTab(direction){
  const h = currentDrawerHousing;
  if(!h) return;
  document.getElementById('routeTabTo').classList.toggle('active', direction === 'to');
  document.getElementById('routeTabBack').classList.toggle('active', direction === 'back');
  document.getElementById('routeChips').innerHTML = routeChipsHTML(h, direction);
  document.getElementById('routeCost').innerHTML = routeCostHTML(h, direction);
  drawRoute(h, direction); // วาดเส้นบนแผนที่เฉพาะตอนกดแท็บเลือกทิศทางเท่านั้น
}

function openDrawer(i){
  const h = housing[i];
  currentDrawerHousing = h;
  clearRoute(); // ยังไม่วาดเส้นทางจนกว่าจะกดแท็บขาไป/ขากลับ

  document.getElementById('dBadges').innerHTML = `
    <span class="badge">${typeIcon(h.type)} ${h.type}</span>

  if(h.wifiSelfCost) wifiText += ` — ค่าใช้จ่ายเอง ${h.wifiSelfCost} บาท/เดือน`;
  const p3 = kv('ค่าไฟ', h.electricity + (h.electricityNote ? ` (${h.electricityNote})` : ''))
    + kv('ค่าน้ำ', h.water + (h.waterNote ? ` (${h.waterNote})` : ''))
    + kv('ค่าส่วนกลาง', h.commonFee) + kv('อินเทอร์เน็ต/WiFi', wifiText);
  if(p3) body += `<details class="section"><summary>ค่าน้ำ-ไฟ-ส่วนกลาง-เน็ต</summary><div class="section-content">${p3}</div></details>`;

  // การเดินทาง — แท็บขาไป/ขากลับ (ยังไม่วาดเส้น/โหลดข้อมูลจนกว่าจะกดเลือกทิศทาง)
  let p4 = `
    <div class="route-tabs">

    <div id="routeCost"></div>
  `;

  body += `<details class="section" open><summary>การเดินทางสู่ มศว</summary><div class="section-content">${p4}</div></details>`;

  const applianceTags = (h.appliances || []).map(a => a.qty > 1 ? `${a.name} ×${a.qty}` : a.name);
  const hasInRoomLaundry = h.laundry && h.laundry.includes('ภายในห้องพัก');
  if(hasInRoomLaundry) applianceTags.push('เครื่องซักผ้า');

  }
  const facList = [];

  if (h.elevator && h.elevator !== "ไม่มี") facList.push('ลิฟต์โดยสาร' + (h.elevatorCount ? ` (${h.elevatorCount} ตัว)` : ''));
  if (h.parking && h.parking !== "ไม่มี") facList.push('ที่จอดรถยนต์' + (h.parkingCount ? ` (${h.parkingCount} คัน)` : '') + (h.parkingFeeNote && h.parkingFeeNote !== 'ไม่มี/ไม่เก็บเพิ่ม' ? ` — ${h.parkingFeeNote}` : ''));
  if(facList.length) p5 += tagList(facList);
  if(h.security) p5 += kv('ความปลอดภัย: เข้าตัวอาคาร', h.security.building) + kv('เข้าลิฟต์', h.security.elevator) + kv('เข้าห้องพัก', h.security.room);
  if(p5) body += `<details class="section"><summary>สิ่งอำนวยความสะดวกส่วนกลาง</summary><div class="section-content">${p5}</div></details>`;

  const p6 = kv('สภาพอาคาร', h.buildingCondition);
  if(p6) body += `<details class="section"><summary>สภาพอาคาร</summary><div class="section-content">${p6}</div></details>`;

  if(h.ratings){
    const r = h.ratings;
    const p7 = starsRow('ทำเลที่ตั้ง', r.location) + starsRow('ความสะอาด', r.cleanliness) + starsRow('ความปลอดภัย', r.safety)
      + starsRow('การบริการ', r.service) + starsRow('สิ่งอำนวยความสะดวก', r.facilities) + starsRow('ที่จอดรถ', r.parking) + starsRow('ความคุ้มค่ากับราคา', r.value);
    body += `<details class="section"><summary>คะแนนรีวิวรายด้าน</summary><div class="section-content">${p7}</div></details>`;
  }

  document.getElementById('dBody').innerHTML = body;

  let quoteSrc = 'ผู้ตอบแบบสอบถาม';
  if(h.respondent){
    const r = h.respondent;
    const parts = [];
    if(r.gender || r.age) parts.push(`นิสิต${r.gender || ''}${r.age ? ' อายุ ' + r.age + ' ปี' : ''}`);
    if(r.faculty) parts.push(r.faculty);
    quoteSrc = parts.join(', ') || quoteSrc;
  }
  const gmapsUrl = h.placeId
    ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.name)}&query_place_id=${h.placeId}`
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.name + ' ' + h.lat + ',' + h.lng)}`;
  const extra = document.createElement('div');
  extra.innerHTML = `
    ${h.quote ? `<div class="quote-block">"${h.quote}"<div class="quote-src">— ${quoteSrc}</div></div>` : ''}
    <a class="gmaps-link" href="${gmapsUrl}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      ดูตำแหน่งนี้ใน Google Maps
    </a>
  `;
  document.getElementById('dBody').appendChild(extra);

  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  if(window.innerWidth <= 820) sidebarEl.classList.remove('expanded');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  // หมายเหตุ: ไม่ลบเส้นทางตรงนี้ เพื่อให้ยังเห็นเส้นบนแผนที่ต่อได้หลังปิดแผง (โดยเฉพาะบนมือถือที่แผงบังแผนที่เกือบเต็มจอ)
}
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('overlay').addEventListener('click', closeDrawer);

(function initBottomSheet() {
  const sheet = sidebarEl;
  const handle = sheet ? sheet.querySelector('.drag-handle') : null;
  if (!sheet || !handle) return;
  let startY = 0, currentY = 0, isDragging = false;
  handle.addEventListener('click', () => { sheet.classList.toggle('expanded'); });
  sheet.addEventListener('touchstart', (e) => {
    if (e.target.closest('.list') && sheet.classList.contains('expanded')) return;
    startY = e.touches[0].clientY; isDragging = true;
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    currentY = e.touches[0].clientY;
    const diff = currentY - startY;
    if (diff > 50) { sheet.classList.remove('expanded'); isDragging = false; }
    else if (diff < -50) { sheet.classList.add('expanded'); isDragging = false; }
  }, { passive: true });
  sheet.addEventListener('touchend', () => { isDragging = false; });
})();
</script>
</body>
</html>
