<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>น้องหมุดเล่าเรื่อง · วิจัยที่พักรอบ มศว</title>
<style>
:root{color-scheme:light;--ink:#152b27;--mint:#c9f9d1;--accent:#ffd363;--cream:#fff9ec}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Tahoma,system-ui,sans-serif}
button,a{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #fa9b37;outline-offset:3px}
main{width:min(1060px,100%);margin:auto;padding:clamp(10px,3vw,28px)}
header{margin-bottom:14px}header p{margin:0;font-size:.82rem;font-weight:bold;color:#31594d;letter-spacing:.025em}
h1{margin:.15em 0;font-size:clamp(1.35rem,4.2vw,2.7rem);line-height:1.22}
nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px}
nav a{color:#203c32;background:#eef6e2;text-decoration:none;padding:7px 10px;border:1px solid #bbd0ad;border-radius:11px;font-size:.87rem}
nav a[aria-current=page]{background:#21493c;color:white;border-color:#21493c}
.player{border:1px solid #d7cbad;border-radius:20px;overflow:hidden;background:#183a34;color:#fff9e8;box-shadow:0 12px 22px #2f553428}
.screen{position:relative;background:#9bddeb;overflow:hidden}
.screen svg{display:block;width:100%;height:auto;aspect-ratio:16/9;overflow:hidden}
.scene-label{position:absolute;top:5%;left:4%;font-size:clamp(.7rem,2vw,1rem);font-weight:bold;background:#fff8dd;color:#20392e;padding:4px 10px;border:1px solid #38534750;border-radius:99px}
.beat{min-height:5.4em;display:grid;align-content:center;padding:11px clamp(12px,3.5vw,26px);margin:0;background:#21463d;border-top:1px solid #0b231c;text-align:center;font-size:clamp(.86rem,2vw,1.12rem)}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:9px 11px}
button{background:#f4f4da;color:#152b27;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.87rem}
#sound[aria-pressed=true]{background:var(--mint)}
#time{font-size:.76rem;margin-left:auto}
progress{display:block;width:100%;height:5px;border:0;accent-color:var(--accent);background:#546f56}
progress::-webkit-progress-bar{background:#546f56}progress::-webkit-progress-value{background:var(--accent)}
.note{font-size:.79rem;margin:9px 2px;color:#36574e}
details{font-size:.88rem;margin-top:12px}summary{cursor:pointer;font-weight:bold}details ol{padding-left:1.5em}
.floating{transform-box:fill-box;transform-origin:center;animation:float 1.5s ease-in-out infinite alternate}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s var(--delay,0s) cubic-bezier(.23,.82,.37,1.18) both}
.draw{stroke-dasharray:1;animation:trace 2s ease-out both}
.mood-walk{animation:mood-walk 2s ease-out both}
.mood-bob{animation:mood-bob .29s ease-in-out 6 alternate}
.cloud{animation:drift 10s linear infinite alternate}
.sun{transform-origin:800px 85px;animation:shine 3s ease-in-out infinite alternate}
.scene{animation:scene-in .35s ease-out both}
.player.paused .screen *{animation-play-state:paused!important}
@keyframes scene-in{from{opacity:.65}to{opacity:1}}
@keyframes float{to{transform:translateY(-7px)}}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes mood-walk{from{transform:translateX(-245px)}to{transform:translateX(0)}}
@keyframes mood-bob{to{transform:translateY(-10px) rotate(-2deg)}}
@keyframes drift{to{transform:translateX(40px)}}
@keyframes shine{to{transform:scale(1.12)}}
@media(max-width:530px){.player{border-radius:12px}.beat{min-height:6em}.controls{gap:5px}.controls button{padding:6px 7px}}
@media(prefers-reduced-motion:reduce){.screen *{animation:none!important}}
</style>
</head>

  end: (_,b) => street()+tiles(['S','L','N'])+(b?pop(pill(520,438,380,'ดูผลทั้ง 14 โมเดลต่อได้เลย','#ffe493',29),.5):'')+mood(63,350,153),
};

const cues = episode.scenes.flatMap(([key,title,lines]) => lines.map((line,beat) => ({
  key,title,line,beat,duration:Math.max(5900,line.length*80+1400),
})));
const total = cues.reduce((sum,cue) => sum+cue.duration,0);
const cumulative = cues.map((_,i)=>cues.slice(0,i).reduce((sum,cue)=>sum+cue.duration,0));
const speech = window.speechSynthesis;
let sound = false;
let narration;
let cursor = 0;
let elapsed = 0;
let previousFrame;
let playing = true;
let visible = !('IntersectionObserver' in window);

function thaiVoice() {
  return speech?.getVoices().find(voice => /^th(?:[-_]|$)/i.test(voice.lang));
}
function syncSoundControl() {
  $('sound').setAttribute('aria-pressed', String(sound));
  $('sound').textContent = sound ? 'ปิดเสียงเล่า' : 'เปิดเสียงเล่า';
}
function speak() {
  if (!sound || !playing || !visible) return;
  const voice = thaiVoice();
  if (!voice) return;
  speech.cancel();
  narration = new SpeechSynthesisUtterance(cues[cursor].line);
  narration.voice = voice;
  narration.lang = 'th-TH';
  narration.rate = 1;
  narration.onerror = ({error}) => {
    if (error === 'interrupted' || error === 'canceled') return;
    sound = false;
    syncSoundControl();
    $('sound-note').textContent = 'เสียงเล่าเริ่มไม่ได้ในเบราว์เซอร์นี้ ดูซับต่อได้เลย';
  };
  speech.speak(narration);
}
function showCue() {
  const {key,title,line,beat} = cues[cursor];
  $('scene').innerHTML = '<g class="scene">'+scenesArt[key](key,beat)+'</g>';
  $('label').textContent = title;
  $('caption').textContent = line;
  speak();
}
function showProgress() {
  const position = Math.min(total,cumulative[cursor] + Math.min(elapsed,cues[cursor].duration));
  $('progress').value = position / total;
  const time = value => Math.floor(value/60000)+':'+String(Math.floor(value/1000)%60).padStart(2,'0');
  $('time').textContent = time(position) + ' / ' + time(total);
}
function pauseState() {
  document.querySelector('.player').classList.toggle('paused', !playing || !visible);
  $('play').textContent = playing ? 'พัก' : cursor === cues.length-1 && elapsed>=cues[cursor].duration ? 'เล่นอีกครั้ง' : 'เล่นต่อ';
}
function restart() {
  speech?.cancel();
  cursor=0;
  elapsed=0;
  playing=true;
  previousFrame=undefined;
  showCue();
  showProgress();
  pauseState();
}
$('restart').addEventListener('click', restart);
$('play').addEventListener('click', () => {
  if (!playing && cursor===cues.length-1 && elapsed>=cues[cursor].duration) {
    restart();
    return;
  }
  playing=!playing;
  previousFrame=undefined;
  if (sound) {
    if (!playing && speech.speaking) speech.pause();
    else if (playing && speech.paused) speech.resume();
    else if (playing && !speech.speaking) speak();
  }
  pauseState();
});
$('sound').addEventListener('click', () => {
  if (sound) {
    sound=false;
    speech?.cancel();
  } else if (!thaiVoice()) {
    $('sound-note').textContent = 'ตอนนี้ยังไม่พบเสียงภาษาไทยบนเบราว์เซอร์หรืออุปกรณ์นี้ ภาพกับซับยังเล่นได้ตามปกติ';
  } else {
    sound=true;
    if (!playing && cursor===cues.length-1 && elapsed>=cues[cursor].duration) restart();
    else {
      elapsed=0;
      speak();
    }
    $('sound-note').textContent = 'เสียงเล่าใช้เสียงภาษาไทยจากอุปกรณ์ของผู้ชม';
  }
  syncSoundControl();
});
function tick(now) {
  if (playing && visible && !document.hidden) {
    if (previousFrame !== undefined) elapsed += Math.min(now-previousFrame,150);
    previousFrame=now;
    const cue=cues[cursor];
    const speaking = sound && speech.speaking && !speech.paused;
    if (elapsed>=cue.duration && (!speaking || elapsed>=cue.duration+9500)) {
      if (cursor===cues.length-1) {
        playing=false;
        speech?.cancel();
        pauseState();
      } else {
        cursor++;
        elapsed=0;
        showCue();
      }
    }
    showProgress();
  } else previousFrame=undefined;
  requestAnimationFrame(tick);
}
if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver(([entry]) => {
    const wasVisible=visible;
    visible=entry.isIntersecting;
    if (wasVisible && !visible && sound && speech.speaking) speech.pause();
    if (!wasVisible && visible && playing && sound) {
      if (speech.paused) speech.resume();
      else speak();
    }
    pauseState();
  },{threshold:.05});
  observer.observe(document.querySelector('.screen'));
}
showCue();
showProgress();
pauseState();
requestAnimationFrame(tick);

</script>
